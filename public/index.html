<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAGI KEY Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#090b12;color:#f5f7ff;min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:32px 18px}.brand{font-size:28px;font-weight:800;margin-bottom:6px}.sub{color:#9299aa;margin-bottom:28px}
.card{background:#111522;border:1px solid #252b3b;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0006}
input,button,select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #30374a;background:#0b0e16;color:#fff;margin-top:8px}
button{background:#635bff;border:0;font-weight:700;cursor:pointer}.secondary{background:#252b3b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hidden{display:none}.stat{font-size:28px;font-weight:800}.muted{color:#8f97aa}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:11px;border-bottom:1px solid #252b3b;font-size:14px}.error{color:#ff7d7d;margin-top:12px}.ok{color:#6ee7a8;margin-top:12px}
@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.card{padding:18px}}
</style></head><body><main class="wrap">
<div class="brand">🔐 NAGI KEY</div><div class="sub">License Management Admin Panel</div>
<section id="login" class="card" style="max-width:460px;margin:50px auto"><h2>Admin Login</h2>
<form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Login</button><div id="msg"></div></form></section>
<section id="dash" class="hidden"><div class="top"><div><h2 style="margin:0">Dashboard</h2><div class="muted" id="who"></div></div><button id="logoutBtn" class="secondary" style="width:auto">Logout</button></div>
<div class="grid"><div class="card"><div class="muted">Total Licenses</div><div class="stat" id="total">0</div></div><div class="card"><div class="muted">Active</div><div class="stat" id="active">0</div></div><div class="card"><div class="muted">Expired</div><div class="stat" id="expired">0</div></div></div>
<div class="card" style="margin-top:16px"><h3>Generate License</h3><div class="grid"><div><label>Product</label><input id="product" value="SANTHOSH_BARCODE_GEN"></div><div><label>Plan</label><input id="plan" value="CUSTOM"></div><div><label>Expiry Date</label><input id="expiry" type="datetime-local"></div><div><label>Max Activations</label><input id="max" type="number" value="1" min="1"></div></div><button id="generateBtn">Generate Key</button><div id="genmsg"></div></div>
<div class="card" style="margin-top:16px"><div class="top"><h3 style="margin:0">Licenses</h3><button id="refreshBtn" class="secondary" style="width:auto">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Key</th><th>Product</th><th>Plan</th><th>Status</th><th>Expiry</th><th>Devices</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</main><script src="/app.js" defer></script></body></html>
